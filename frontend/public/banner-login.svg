<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="fondoElegante" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="50%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#030303" />
    </linearGradient>
    
    <radialGradient id="resplandorDorado" cx="50%" cy="38%" r="40%">
      <stop offset="0%" stop-color="#e5be6b" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="textoDorado" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3d082" />
      <stop offset="100%" stop-color="#c89b3f" />
    </linearGradient>
  </defs>

  <rect width="600" height="900" fill="transparent" />
  
  <rect width="600" height="900" fill="transparent" />
 
  <image 
    href="/logo.png" 
    x="120" 
    y="130" 
    width="360" 
    height="360" 
    preserveAspectRatio="xMidYMid meet" 
    opacity="0"
  />
  <g transform="translate(60, 580)" opacity="0">

    <text font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" x="0" y="0">
      Encuentra tu barbería
    </text>
    
    <text font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="800" fill="url(#textoDorado)" x="0" y="45">
      ideal en segundos
    </text>
    
    <text font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#8e8e93" x="0" y="95">
      Reserva citas, guarda tus barberías favoritas
    </text>
    <text font-family="'Inter', system-ui, sans-serif" font-size="16" fill="#8e8e93" x="0" y="120">
      y descubre las mejores cerca de ti.
    </text>
  </g>

  <text font-family="'Inter', system-ui, sans-serif" font-size="12" fill="#444444" x="60" y="840" opacity="0">
    © 2026 Barber Hub · Todos los derechos reservados
  </text>
</svg>
